name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Pytest (70%+ Coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: finance_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint backend with Ruff
        working-directory: backend
        run: ruff check app tests scripts
      - name: Run Alembic migrations & Pytest with coverage gate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://finance_user:test_password@localhost:5432/finance_tracker_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_test_secret_key_0123456789abcdef0123456789abcdef0123456789ab
        run: |
          alembic upgrade head
          PYTHONPATH=. pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend:
    name: Frontend Typecheck, Lint & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Production build
        working-directory: frontend
        run: npm run build

  docker:
    name: Validate Production Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Copy example env
        run: cp .env.example .env
      - name: Build production images
        run: docker compose build
